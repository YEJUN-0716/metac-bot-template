name: Forecast on new MiniBench questions (budget mode)

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    permissions:
      contents: write # only to push the shadow-forecast log to the forecast-log branch
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          # Budget mode: MiniBench only. Use `python main.py` (tournament mode) to add the main tournament back.
          poetry run python main.py --mode minibench
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          # Shadow arm (logged, never submitted). "same" = A/A test. Once AskNews keys
          # are set, change to "none" so main = AskNews, shadow = no research.
          SHADOW_RESEARCH: same
      # Runners are wiped after each job, so append this run's rows to a JSONL file on
      # a separate branch. Only question ids, forecasts, configs and costs; no secrets.
      - name: Save forecast log to the forecast-log branch
        if: always()
        run: |
          [ -s forecast_log.jsonl ] || { echo "No new forecast rows"; exit 0; }
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin forecast-log; then
            git worktree add -B forecast-log ../log FETCH_HEAD
          else
            git worktree add --orphan -b forecast-log ../log
          fi
          mkdir -p ../log/logs
          cat forecast_log.jsonl >> ../log/logs/forecasts.jsonl
          cd ../log
          git add logs/forecasts.jsonl
          git commit -m "Forecast log: run ${{ github.run_id }}"
          git push origin forecast-log